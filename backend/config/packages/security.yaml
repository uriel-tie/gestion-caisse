security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # On configure le provider pour utiliser notre Entité "Utilisateur" et l'email comme identifiant
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # 1. Firewall de connexion : Reçoit email/mdp -> Renvoie un Token JWT
        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login_check # La route définie dans routes.yaml
                username_path: email         # Le champ JSON attendu pour l'identifiant
                password_path: password      # Le champ JSON attendu pour le mot de passe
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # 2. Firewall API : Protège le reste de l'API en vérifiant le Token
        api:
            pattern:   ^/api
            stateless: true
            jwt: ~ # Active le système de token

        # 3. Firewall principal (fallback pour le reste du site hors API)
        main:
            lazy: true
            provider: app_user_provider

    # Contrôle d'accès : Définit qui peut accéder à quoi
    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS } # Connexion ouverte à tous
        - { path: ^/api,       roles: IS_AUTHENTICATED_FULLY } # Tout le reste de l'API nécessite d'être connecté

# Bloc de configuration pour les tests (ne pas toucher, c'est bien de le garder)
when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon